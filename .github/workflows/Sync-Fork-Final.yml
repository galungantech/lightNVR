name: Sync Fork Final

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch tujuan"
        required: true
        type: choice
        options:
          - sync-main
        default: sync-main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          token: ${{ secrets.PAT_WORKFLOW }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/rivandraa/lightNVR.git
          git fetch upstream
          git fetch origin

      - name: Save current commit
        id: before
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)

          echo "LOCAL=$LOCAL"
          echo "UPSTREAM=$UPSTREAM"

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync with upstream
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git merge upstream/main --no-edit

      - name: Push changes
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git push origin ${{ github.event.inputs.target_branch }}

      - name: Generate change list
        if: steps.check.outputs.has_updates == 'true'
        id: changes
        run: |
          git diff --name-status \
            ${{ steps.before.outputs.sha }} HEAD > changes.txt

      - name: Telegram Notification
        if: always()
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          BRANCH="${{ github.event.inputs.target_branch }}"

          if [ "${{ job.status }}" != "success" ]; then
            MSG="❌ *Sync Fork Gagal*"

          elif [ "${{ steps.check.outputs.has_updates }}" = "false" ]; then
            MSG="🛎️ *Sync Fork Selesai*%0A%0ATidak ada update dari upstream."

          else
            MSG="🛎️ *Sync Fork Berhasil*"

            CURRENT_FOLDER=""

            while read -r status path; do
              [ -z "$path" ] && continue

              FOLDER=$(dirname "$path")
              FILE=$(basename "$path")

              [ "$FOLDER" = "." ] && FOLDER="root"

              case "$status" in
                A*) ICON="🆕" ;;
                M*) ICON="✏️" ;;
                D*) ICON="❌" ;;
                R*) ICON="🔄" ;;
                *) ICON="📄" ;;
              esac

              if [ "$FOLDER" != "$CURRENT_FOLDER" ]; then
                MSG="${MSG}%0A%0A📁 ${FOLDER}/"
                CURRENT_FOLDER="$FOLDER"
              fi

              MSG="${MSG}%0A${ICON} ${FILE}"
            done < changes.txt
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$MSG"
